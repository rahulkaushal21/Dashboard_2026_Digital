name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  # Queue deploys instead of cancelling in-flight ones. Cancelling mid-deploy can
  # leave GitHub Pages wedged and make the next run fail with "Deployment failed,
  # try again later" — letting them run to completion in order avoids that.
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
        env:
          DEPLOY_TARGET: github
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://hsmuxmvhgteexanssigc.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_JCaiRrPs7PQEY0nvbczVQg__N-s9cLN' }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The action polls the Pages API and aborts with "Timeout reached,
          # aborting!" when the deployment has not reported success. The default
          # is 600000ms, and on 6 Aug 2026 two runs died at exactly 10m09s with
          # the artifact uploaded fine (450 KB) — while the last good run, on
          # 31 Jul, completed in 12 SECONDS.
          #
          # 20 minutes distinguishes the two explanations: if Pages is merely
          # backlogged this now succeeds, and if it is genuinely wedged this
          # still fails and the fix is server-side (Settings > Pages > flip
          # Source away from GitHub Actions and back), which no workflow change
          # can do.
          timeout: 1200000
          # Tolerate transient polling errors rather than treating the first
          # blip as fatal.
          error_count: 10
